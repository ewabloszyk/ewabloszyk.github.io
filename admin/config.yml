# 1. Włączenie trybu lokalnego (KLUCZOWE)
local_backend: true

# 2. Atrapa backendu (wymagana przez CMS, ale local_backend ją nadpisze)
backend:
  name: test-repo

# 3. Gdzie mają trafiać wgrywane zdjęcia i obrazki
media_folder: "static/images" # folder fizyczny w projekcie
public_folder: "/images"       # ścieżka generowana w HTML przez Hugo

